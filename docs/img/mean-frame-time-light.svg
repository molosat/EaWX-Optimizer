<svg viewBox="0 0 680 192" role="img" aria-label="Mean frame time per game, by version" class="chart" xmlns="http://www.w3.org/2000/svg" width="680">
<title>Mean frame time per game, by version</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --plain: #eb6834;
  --default: #1baf7a;
  --cand: #2a78d6;
  --vanilla: #898781;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c0: #c3c2b7;
  --todo-bg: #fff3c4; --todo-ink: #5c4400;
}
.chart { display: block; width: 100%; height: auto; overflow: visible; background: var(--surface); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
/* chart ink */
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); }
.chart .val { fill: var(--ink); font-variant-numeric: tabular-nums; }
.chart .inbar { fill: #fff; }
.chart .s-plain { fill: var(--plain); stroke: var(--plain); }
.chart .s-default { fill: var(--default); stroke: var(--default); }
.chart .s-cand { fill: var(--cand); stroke: var(--cand); }
.chart .s-vanilla { fill: var(--vanilla); stroke: var(--vanilla); }
.chart .s-cap { fill: var(--c5); stroke: var(--c5); }
.chart path.s-plain, .chart path.s-default, .chart path.s-cand,
.chart rect.s-plain, .chart rect.s-default, .chart rect.s-cand { stroke: none; }
.chart .c0 { fill: var(--c0); } .chart .c1 { fill: var(--c1); } .chart .c2 { fill: var(--c2); }
.chart .c3 { fill: var(--c3); } .chart .c4 { fill: var(--c4); } .chart .c5 { fill: var(--c5); }
.chart .c6 { fill: var(--c6); }
.chart .ring { stroke: var(--surface); stroke-width: 2; }
.chart .wash { opacity: 0.24; stroke: none; }
.chart .meanline { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .trace { fill: none; stroke-width: 1.25; stroke-linejoin: round; }
.chart .range { stroke-width: 2; stroke-linecap: round; opacity: 0.55; }
.chart circle:hover, .chart rect:hover, .chart path:hover { opacity: 0.8; }
</style>
